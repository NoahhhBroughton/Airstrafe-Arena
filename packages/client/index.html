<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Airstrafe Arena</title>
    <!-- Inline so the dev server has no favicon 404, keeping the console clean enough that a
         real error stands out. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1d24'/%3E%3Cpath d='M2 11 L8 4 L14 11' stroke='%237aa2f7' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }

      /* HUD sits above the canvas but must never eat clicks - the canvas needs them to
         acquire pointer lock. */
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #e6e6e6;
        user-select: none;
      }

      .hud-panel {
        position: absolute;
        left: 16px;
        bottom: 16px;
        padding: 12px 14px;
        min-width: 260px;
        background: rgba(12, 14, 18, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        backdrop-filter: blur(6px);
      }

      .hud-speed { display: flex; align-items: baseline; gap: 4px; }
      .hud-speed-value { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .hud-speed-unit { font-size: 12px; opacity: 0.5; }

      .hud-graph { display: block; width: 100%; height: 60px; margin: 6px 0 10px; }

      .hud-stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
      }
      .hud-stats dt { opacity: 0.45; }
      .hud-stats dd { margin: 0; white-space: pre; font-variant-numeric: tabular-nums; }

      /* Crosshair. Instagib is an aim game; a centre dot is not optional even in a movement
         prototype, because it is also the only fixed reference for judging strafe turn rate. */
      .hud-center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        margin: -1.5px 0 0 -1.5px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
      }

      .hud-spots {
        position: absolute;
        right: 16px;
        bottom: 16px;
        padding: 10px 12px;
        background: rgba(12, 14, 18, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        text-align: right;
        line-height: 1.7;
      }
      .hud-spots b { font-weight: 600; opacity: 0.45; margin-right: 8px; }

      .hud { transition: opacity 0.2s; }

      /* Settings menu. The container ignores clicks so that clicking the empty space around
         the panel falls through to the canvas and re-locks the pointer; only the panel itself
         is interactive. */
      .menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #e6e6e6;
        background: rgba(10, 12, 16, 0.55);
      }
      .menu.is-hidden { display: none; }

      .menu-panel {
        pointer-events: auto;
        width: min(560px, calc(100vw - 48px));
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding: 22px 26px;
        background: rgba(16, 19, 25, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .menu-header h1 { margin: 0; font-size: 20px; letter-spacing: 0.02em; }
      .menu-status { margin: 6px 0 0; font-size: 12px; }
      .menu-status[data-state="ok"] { color: #7bd88f; }
      .menu-status[data-state="warn"] { color: #f7a76a; }
      .menu-status[data-state="pending"] { color: #9aa4b8; }

      .menu-section { margin-top: 20px; }
      .menu-section h2 {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        opacity: 0.45;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 5px;
      }

      .menu-field {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 2px 12px;
        padding: 7px 0;
      }
      .menu-field label { grid-column: 1; }
      .menu-field input { grid-column: 2; }
      .menu-hint {
        grid-column: 1 / -1;
        margin: 2px 0 0;
        font-size: 11px;
        line-height: 1.45;
        opacity: 0.42;
      }

      .menu-field input[type="number"] {
        width: 84px;
        padding: 5px 8px;
        font: inherit;
        color: #e6e6e6;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      .menu-field input[type="checkbox"] { width: 16px; height: 16px; accent-color: #7aa2f7; }
      .menu-field input:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 1px; }

      .menu-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }
      .menu-footer button {
        padding: 8px 18px;
        font: inherit;
        color: #e6e6e6;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        cursor: pointer;
      }
      .menu-footer button:hover { background: rgba(255, 255, 255, 0.14); }
      .menu-footer button[data-role="play"] {
        background: #3b5bbf;
        border-color: #4c6fd6;
      }
      .menu-footer button[data-role="play"]:hover { background: #4c6fd6; }

      .menu-keys { margin: 16px 0 0; font-size: 11px; opacity: 0.4; text-align: center; }
      .menu-keys b { font-weight: 600; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
